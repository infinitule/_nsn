[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noesis"
version = "0.2.0"
description = "NOESIS — Neural Optically-grounded Experiential Self-aware Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
viz = ["matplotlib>=3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
